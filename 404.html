<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>404 — Ahmed Reda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #050505; color: #f9fafb;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px;
            overflow: hidden;
        }
        .bg {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .content { position: relative; z-index: 1; }
        .err-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 600;
            line-height: 1;
            background: linear-gradient(135deg, #00d4ff, #9b7bff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
            text-shadow: none;
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
        p  { color: #888; font-size: 1rem; margin-bottom: 40px; }
        a  {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.9375rem; font-weight: 600;
            color: #050505; background: #f9fafb;
            padding: 14px 28px; border-radius: 100px;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }
        a:hover { background: #00d4ff; transform: translateY(-2px); }
        .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; color: #444; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="bg" aria-hidden="true"></div>
    <div class="content">
        <div class="err-num">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for has drifted into the void.</p>
        <a href="/">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Back to Portfolio
        </a>
        <p class="mono">Ahmed Reda · Senior Flutter Developer</p>
    </div>
</body>
</html>
